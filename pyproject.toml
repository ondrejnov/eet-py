[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eet-py"
version = "0.1.0"
description = "EET 2.0 (Czech electronic registration of sales, interface v4) client for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = [
    "cryptography>=45",
    "lxml>=5",
    # Windows has no system time zone database, zoneinfo needs Europe/Prague from here.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/eet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
